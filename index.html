<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Suroso | Power BI Developer</title>

<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar">
    <div class="logo">Suroso</div>
    <div class="menu">
        <a onclick="openModal('about')">About</a>
        <a onclick="openModal('projects')">Projects</a>
        <a onclick="openModal('dashboard')">Dashboard</a>
        <a onclick="openModal('contact')">Contact</a>
    </div>
</nav>

<!-- HERO -->
<section class="hero container">
    <h1 id="job">Loading...</h1>
    <p id="tagline"></p>

    <div class="btn-group">
        <a onclick="openModal('contact')" class="btn">Hire Me</a>
        <a id="waLink" target="_blank" class="btn outline">WhatsApp</a>
    </div>
</section>

<!-- VALUE SECTION -->
<section class="container section">
    <div class="grid" id="highlights"></div>
</section>

<!-- MODAL -->
<div id="modal" class="modal">
    <div class="modal-content">
        <span class="close" onclick="closeModal()">&times;</span>
        <div id="modal-body"></div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
